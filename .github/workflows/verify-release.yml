name: verify-release

# Answers "what actually shipped?" for the whole release — the CLI's
# binaries, the action's pin and its floating v1, the pipe's image on both
# architectures, and the pipe's tag on both of its remotes.
#
# Three ways in:
#
#   workflow_call      — release.yml calls this once the wrapper bumps are
#     open, with wait: the bump PRs auto-merge and the wrappers release
#     over the next few minutes, so the check retries for up to half an
#     hour. Still failing then, something is stuck: a wrapper's checks, its
#     release, a mirror. This used to be `release: published`, which never
#     fired: release-please publishes with GITHUB_TOKEN, and GitHub starts
#     no workflows from its events.
#   schedule           — the weekly cadence catches drift that appears
#     outside a release (a hand-cut tag, a rebuilt image).
#   workflow_dispatch  — check any release, any time.
#
# Cross-repo reads are all of public repositories, so the default token is
# enough and no App or PAT is involved.
on:
  workflow_call:
    inputs:
      tag:
        description: The gocov release to verify.
        required: true
        type: string
      wait:
        description: Retry for up to 30 minutes while the wrappers catch up.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "gocov release to verify (default: the newest one)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the release
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WAIT_MINUTES: ${{ inputs.wait && '30' || '0' }}
        run: |
          # Exit 1 is a failed check, worth waiting out while the wrappers
          # release; exit 2 means the script could not run, which waiting
          # does not fix.
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            rc=0; ./scripts/verify-release.sh "$TAG" >report.txt 2>&1 || rc=$?
            if [ "$rc" -ne 1 ] || [ "$(date +%s)" -ge "$deadline" ]; then break; fi
            echo "$(tail -2 report.txt | head -1) — retrying in a minute"
            sleep 60
          done
          cat report.txt
          exit "$rc"

      - name: Publish the report
        if: always()
        run: |
          {
            echo '```'
            cat report.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error title=verify-release::the release is not consistent across repos; see the job summary"
          exit 1
