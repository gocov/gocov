name: release-please

# Keeps a release pull request open on main. The PR is the review gate:
# it carries the version, the CHANGELOG entry and the bumped install-
# snippet pins, and nothing is tagged until it is merged — so a mistake is
# a PR comment rather than a tag that has to be burned.
#
# Versions are inferred from the conventional commit subjects on main
# (feat: → minor while pre-1.0, fix:/perf: → patch); pr-title.yml keeps
# every squash subject readable. To state a version instead:
#
#   git commit --allow-empty -m "chore: release 0.13.0" -m "Release-As: 0.13.0"
#
# The pins live in the CI recipe docs (gitlab-ci.md, ci-other.md), the
# onboarding template and the PinnedCLIVersion constant, wrapped in
# x-release-please-start-version markers that sit outside the snippets
# themselves — an HTML comment in the Markdown, a Go template comment in
# the page, so neither reaches a reader or the browser.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The release PR and, on its merge, the tag and the GitHub release.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Two runs of the action, two tokens. The tag and the GitHub release
      # carry GITHUB_TOKEN, which starts no workflows: release.yml is
      # called by the publish job below, and an App-pushed tag would start
      # it a second time through its own `on: push: tags`.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # The release PR is opened and updated as the cross-repo App, so its
      # CI runs by itself; a PR pushed with GITHUB_TOKEN starts no
      # workflows and waited on a hand-approved CI run. Until the App is
      # installed on this repo the token step fails, and the PR falls back
      # to GITHUB_TOKEN — the old behaviour, with a warning.
      - uses: actions/create-github-app-token@v3
        id: app
        continue-on-error: true
        with:
          client-id: ${{ secrets.CROSSBUMP_APP_ID }}
          private-key: ${{ secrets.CROSSBUMP_APP_PRIVATE_KEY }}
          owner: gocov
          repositories: gocov
          # The release branch (contents) and the PR with its labels
          # (pull-requests).
          permission-contents: write
          permission-pull-requests: write
      - name: Note the fallback
        if: steps.app.outcome == 'failure'
        run: echo "::warning title=release-please::the cross-repo App is not installed on gocov/gocov; the release PR is opened with GITHUB_TOKEN and its CI needs a manual run"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          token: ${{ steps.app.outputs.token || github.token }}

  # A tag pushed by the action carries GITHUB_TOKEN, and GitHub does not
  # start workflow runs from those — release.yml's own `on: push: tags`
  # would never fire here. Calling it directly sidesteps that entirely,
  # and keeps one copy of the build rather than a second that drifts.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # A called workflow can never hold more permission than its caller
    # grants, so everything release.yml's jobs need is named here: the
    # release itself (contents), the GHCR push (packages), the deploy
    # role and the provenance signing (id-token), the provenance itself
    # (attestations), the image's storage record (artifact-metadata). The
    # secrets are named too: the App's, for the wrapper bumps. The deploy's
    # smoke token is a production environment secret and needs no passing.
    secrets:
      CROSSBUMP_APP_ID: ${{ secrets.CROSSBUMP_APP_ID }}
      CROSSBUMP_APP_PRIVATE_KEY: ${{ secrets.CROSSBUMP_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
