name: release

# One build, two ways in:
#
#   workflow_call — release-please merged a release PR and tagged it. The
#     normal path; the tag comes in as an input.
#   push of a v* tag — the escape hatch. Turn the bot off, cut a tag by
#     hand, and everything below still runs exactly as it did before.
#
# The tag cannot be read from GITHUB_REF_NAME any more: on the called
# path that is the branch, and baking "main" into -X main.version would
# be a silent, shipped mistake. It is resolved once, into $TAG.
#
# release-please creates the GitHub Release itself, so publishing has to
# cope with a release that already exists as well as one that does not.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string
    secrets:
      # The cross-repo App, for the wrapper bumps, and the deploy's smoke
      # upload token. A pushed tag (the hand-cut path) reads them from the
      # repository directly.
      CROSSBUMP_APP_ID:
        required: true
      CROSSBUMP_APP_PRIVATE_KEY:
        required: true
      GOCOV_SMOKE_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the attestation is signed with the job's OIDC
      # identity and stored against the repo.
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # No caches in the release build: a cache any earlier run could have
      # written is an input to the shipped binaries. Slower, and honest.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # gocov-server embeds the web UI (internal/webui), so it is built
      # before anything compiles.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm test && npm run build

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/gocov-$os-$arch$ext" ./cmd/gocov
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/gocov-server-$os-$arch$ext" ./cmd/gocov-server
          done
          (cd dist && sha256sum * > checksums.txt)

      # SLSA build provenance for every asset, checksums.txt included: it
      # records which commit of this workflow built each file, so a
      # download can be checked against the repo rather than against a
      # checksum that travelled with it:
      #
      #   gh attestation verify gocov-linux-amd64 --repo gocov/gocov
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Hand-cut tag: nothing exists yet, so this is the whole job.
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
            exit 0
          fi

          gh release upload "$TAG" dist/* --clobber

          # release-please wrote the body from the CHANGELOG. Put the
          # generated pull-request list underneath it rather than instead
          # of it: the written part belongs on top, and today the CHANGELOG
          # section is thin, so losing this list would make the notes worse
          # than they were before any of this was automated.
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
          *"## What's Changed"*)
            echo "notes already carry the generated list; leaving them alone"
            ;;
          *)
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body >generated.md
            { printf '%s\n\n' "$body"; cat generated.md; } >notes.md
            gh release edit "$TAG" --notes-file notes.md
            ;;
          esac

  # The server image every deployment runs — the hosted instance pulls it
  # by exact version, self-hosters pull it instead of building from source.
  # It only exists once the release job has passed the tests, so an image
  # tag implies a release tag.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # attest-build-provenance also files an artifact-metadata storage
      # record for a registry-pushed image (which registry, which version),
      # listed under https://github.com/orgs/gocov/artifacts. Without this
      # the record fails and the step warns on every release.
      artifact-metadata: write
    env:
      # inputs.tag is empty unless this workflow was called with one; the
      # fallback keeps the hand-pushed-tag path working.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        # vX.Y.Z also lands on X.Y and latest. Those two float and are for
        # self-host convenience only; production pins the full version.
        run: |
          minor=${TAG#v}; minor=${minor%.*}
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/gocov/gocov-server:${{ env.TAG }}
            ghcr.io/gocov/gocov-server:${{ steps.tags.outputs.minor }}
            ghcr.io/gocov/gocov-server:latest
      # The same provenance for the image, attached to the manifest digest
      # (which all three tags share) and pushed to GHCR next to it, so a
      # self-hoster can check what they are about to run:
      #
      #   gh attestation verify oci://ghcr.io/gocov/gocov-server:vX.Y.Z --repo gocov/gocov
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/gocov/gocov-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The self-host paths, exercised on every release with the image just
  # pushed. First the root compose file (the evaluation stack) comes up
  # from the pulled image, migrates, answers /healthz and the home page,
  # and turns an upload with a bad token away. Then deploy/'s production
  # compose does the same with its bundled Postgres, through Caddy on
  # https://localhost (Caddy's own CA, hence -k). Production no longer
  # runs compose, so nothing else would notice either path rotting.
  selfhost-smoke:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Bring the self-host compose up from the released image
        run: |
          GOCOV_VERSION=$TAG docker compose -f docker-compose.yml -f .github/compose-smoke.yml \
            up -d --wait --wait-timeout 120
      - name: Smoke
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS -o /dev/null http://localhost:8080/
          # A fresh instance has no workspace, so the upload API's answer
          # to a made-up token is the one thing it can prove: the
          # authenticated path is up and refuses cleanly.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer not-a-token" \
            -F "repo=gocov/smoke" -F "commit=0000000000000000000000000000000000000000" \
            -F "file=@go.mod" http://localhost:8080/api/v1/upload)
          [ "$code" = 401 ] || { echo "upload with a bad token answered $code, want 401" >&2; exit 1; }
      - name: Bring the production compose up from the released image
        working-directory: deploy
        run: |
          set -euo pipefail
          # The evaluation stack is done; free its Postgres and port first.
          # The overlay requires GOCOV_VERSION even to tear down, since
          # compose interpolates the files before it looks at the project.
          GOCOV_VERSION=$TAG docker compose -f ../docker-compose.yml -f ../.github/compose-smoke.yml down -v
          # .env.example with the four required values filled in and the
          # bundled Postgres turned on, the way the docs say to.
          sed -e "s/^GOCOV_VERSION=.*/GOCOV_VERSION=$TAG/" \
              -e 's/^GOCOV_HOST=.*/GOCOV_HOST=localhost/' \
              -e 's#^GOCOV_BASE_URL=.*#GOCOV_BASE_URL=https://localhost#' \
              -e "s/^GOCOV_SECRET_KEY=.*/GOCOV_SECRET_KEY=$(openssl rand -hex 32)/" \
              -e '/^DATABASE_URL=$/d' \
              -e 's/^#COMPOSE_PROFILES=db/COMPOSE_PROFILES=db/' \
              -e 's/^#POSTGRES_PASSWORD=/POSTGRES_PASSWORD=/' \
              -e 's/^#DATABASE_URL=/DATABASE_URL=/' \
              .env.example > .env
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120
      - name: Smoke the production compose
        run: |
          set -euo pipefail
          curl -fsSk https://localhost/healthz
          curl -fsSk -o /dev/null https://localhost/
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer not-a-token" \
            -F "repo=gocov/smoke" -F "commit=0000000000000000000000000000000000000000" \
            -F "file=@go.mod" https://localhost/api/v1/upload)
          [ "$code" = 401 ] || { echo "upload with a bad token answered $code, want 401" >&2; exit 1; }
      - name: Logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f .github/compose-smoke.yml logs || true
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs || true

  # The wrappers follow the release, and the release checks itself:
  # wrappers.yml opens the three bump PRs and then runs verify-release.
  # Behind the deploy, so a wrapper never ships a CLI newer than the hosted
  # server. Its own workflow so that, when a deploy fails after its
  # rollout, the rest can be dispatched by hand for the tag instead of
  # re-running a release.
  wrappers:
    needs: deploy
    uses: ./.github/workflows/wrappers.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      CROSSBUMP_APP_ID: ${{ secrets.CROSSBUMP_APP_ID }}
      CROSSBUMP_APP_PRIVATE_KEY: ${{ secrets.CROSSBUMP_APP_PRIVATE_KEY }}
    permissions:
      contents: read

  # Deploying is a separate, reusable workflow so a rollback is the same
  # job dispatched by hand with an older tag. Its job carries
  # environment: production, so the run waits here for approval.
  # contents: write is for its docs job, which moves docs-live to the tag.
  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    # The smoke upload's token, a repository secret passed down the chain:
    # a production environment secret does not reach a job in a workflow
    # called two levels deep (v0.26.3's deploy read it as empty).
    secrets:
      GOCOV_SMOKE_TOKEN: ${{ secrets.GOCOV_SMOKE_TOKEN }}
    permissions:
      id-token: write
      contents: write
