name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/gocov-$os-$arch$ext" ./cmd/gocov
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/gocov-server-$os-$arch$ext" ./cmd/gocov-server
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  # The server image every deployment runs — the hosted instance pulls it
  # by exact version, self-hosters pull it instead of building from source.
  # It only exists once the release job has passed the tests, so an image
  # tag implies a release tag.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # inputs.tag is empty unless this workflow was called with one; the
      # fallback keeps the hand-pushed-tag path working.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        # vX.Y.Z also lands on X.Y and latest. Those two float and are for
        # self-host convenience only; production pins the full version.
        run: |
          minor=${TAG#v}; minor=${minor%.*}
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/gocov/gocov-server:${{ env.TAG }}
            ghcr.io/gocov/gocov-server:${{ steps.tags.outputs.minor }}
            ghcr.io/gocov/gocov-server:latest

  # Deploying is a separate, reusable workflow so a rollback is the same
  # job dispatched by hand with an older tag. Its job carries
  # environment: production, so the run waits here for approval.
  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
