name: release

# One build, two ways in:
#
#   workflow_call — release-please merged a release PR and tagged it. The
#     normal path; the tag comes in as an input.
#   push of a v* tag — the escape hatch. Turn the bot off, cut a tag by
#     hand, and everything below still runs exactly as it did before.
#
# The tag cannot be read from GITHUB_REF_NAME any more: on the called
# path that is the branch, and baking "main" into -X main.version would
# be a silent, shipped mistake. It is resolved once, into $TAG.
#
# release-please creates the GitHub Release itself, so publishing has to
# cope with a release that already exists as well as one that does not.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the attestation is signed with the job's OIDC
      # identity and stored against the repo.
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # No caches in the release build: a cache any earlier run could have
      # written is an input to the shipped binaries. Slower, and honest.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # gocov-server embeds the web UI (internal/webui), so it is built
      # before anything compiles.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm test && npm run build

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/gocov-$os-$arch$ext" ./cmd/gocov
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/gocov-server-$os-$arch$ext" ./cmd/gocov-server
          done
          (cd dist && sha256sum * > checksums.txt)

      # SLSA build provenance for every asset, checksums.txt included: it
      # records which commit of this workflow built each file, so a
      # download can be checked against the repo rather than against a
      # checksum that travelled with it:
      #
      #   gh attestation verify gocov-linux-amd64 --repo gocov/gocov
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Hand-cut tag: nothing exists yet, so this is the whole job.
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
            exit 0
          fi

          gh release upload "$TAG" dist/* --clobber

          # release-please wrote the body from the CHANGELOG. Put the
          # generated pull-request list underneath it rather than instead
          # of it: the written part belongs on top, and today the CHANGELOG
          # section is thin, so losing this list would make the notes worse
          # than they were before any of this was automated.
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
          *"## What's Changed"*)
            echo "notes already carry the generated list; leaving them alone"
            ;;
          *)
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body >generated.md
            { printf '%s\n\n' "$body"; cat generated.md; } >notes.md
            gh release edit "$TAG" --notes-file notes.md
            ;;
          esac

  # The server image every deployment runs — the hosted instance pulls it
  # by exact version, self-hosters pull it instead of building from source.
  # It only exists once the release job has passed the tests, so an image
  # tag implies a release tag.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # attest-build-provenance also files an artifact-metadata storage
      # record for a registry-pushed image (which registry, which version),
      # listed under https://github.com/orgs/gocov/artifacts. Without this
      # the record fails and the step warns on every release.
      artifact-metadata: write
    env:
      # inputs.tag is empty unless this workflow was called with one; the
      # fallback keeps the hand-pushed-tag path working.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        # vX.Y.Z also lands on X.Y and latest. Those two float and are for
        # self-host convenience only; production pins the full version.
        run: |
          minor=${TAG#v}; minor=${minor%.*}
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/gocov/gocov-server:${{ env.TAG }}
            ghcr.io/gocov/gocov-server:${{ steps.tags.outputs.minor }}
            ghcr.io/gocov/gocov-server:latest
      # The same provenance for the image, attached to the manifest digest
      # (which all three tags share) and pushed to GHCR next to it, so a
      # self-hoster can check what they are about to run:
      #
      #   gh attestation verify oci://ghcr.io/gocov/gocov-server:vX.Y.Z --repo gocov/gocov
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/gocov/gocov-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The self-host paths, exercised on every release with the image just
  # pushed. First the root compose file (the evaluation stack) comes up
  # from the pulled image, migrates, answers /healthz and the home page,
  # and turns an upload with a bad token away. Then deploy/'s production
  # compose does the same with its bundled Postgres, through Caddy on
  # https://localhost (Caddy's own CA, hence -k). Production no longer
  # runs compose, so nothing else would notice either path rotting.
  selfhost-smoke:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Bring the self-host compose up from the released image
        run: |
          GOCOV_VERSION=$TAG docker compose -f docker-compose.yml -f .github/compose-smoke.yml \
            up -d --wait --wait-timeout 120
      - name: Smoke
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS -o /dev/null http://localhost:8080/
          # A fresh instance has no workspace, so the upload API's answer
          # to a made-up token is the one thing it can prove: the
          # authenticated path is up and refuses cleanly.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer not-a-token" \
            -F "repo=gocov/smoke" -F "commit=0000000000000000000000000000000000000000" \
            -F "file=@go.mod" http://localhost:8080/api/v1/upload)
          [ "$code" = 401 ] || { echo "upload with a bad token answered $code, want 401" >&2; exit 1; }
      - name: Bring the production compose up from the released image
        working-directory: deploy
        run: |
          set -euo pipefail
          # The evaluation stack is done; free its Postgres and port first.
          # The overlay requires GOCOV_VERSION even to tear down, since
          # compose interpolates the files before it looks at the project.
          GOCOV_VERSION=$TAG docker compose -f ../docker-compose.yml -f ../.github/compose-smoke.yml down -v
          # .env.example with the four required values filled in and the
          # bundled Postgres turned on, the way the docs say to.
          sed -e "s/^GOCOV_VERSION=.*/GOCOV_VERSION=$TAG/" \
              -e 's/^GOCOV_HOST=.*/GOCOV_HOST=localhost/' \
              -e 's#^GOCOV_BASE_URL=.*#GOCOV_BASE_URL=https://localhost#' \
              -e "s/^GOCOV_SECRET_KEY=.*/GOCOV_SECRET_KEY=$(openssl rand -hex 32)/" \
              -e '/^DATABASE_URL=$/d' \
              -e 's/^#COMPOSE_PROFILES=db/COMPOSE_PROFILES=db/' \
              -e 's/^#POSTGRES_PASSWORD=/POSTGRES_PASSWORD=/' \
              -e 's/^#DATABASE_URL=/DATABASE_URL=/' \
              .env.example > .env
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120
      - name: Smoke the production compose
        run: |
          set -euo pipefail
          curl -fsSk https://localhost/healthz
          curl -fsSk -o /dev/null https://localhost/
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer not-a-token" \
            -F "repo=gocov/smoke" -F "commit=0000000000000000000000000000000000000000" \
            -F "file=@go.mod" https://localhost/api/v1/upload)
          [ "$code" = 401 ] || { echo "upload with a bad token answered $code, want 401" >&2; exit 1; }
      - name: Logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f .github/compose-smoke.yml logs || true
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs || true

  # A release is not finished until the wrappers follow: this opens a bump
  # PR in gocov-action (action.yml's pinned CLI), upload-pipe (Dockerfile
  # ARG + pipe.yml + CHANGELOG) and gitlab-component (the template's
  # version default + README + CHANGELOG), authored by the cross-repo
  # App, which is installed on exactly those three repos. Merging a bump PR
  # is that wrapper's release decision — its tag-on-release-merge workflow
  # takes it from there.
  #
  # Behind the deploy, not beside the image build: a wrapper release puts
  # the new CLI in front of every user of that wrapper, so the PRs open only
  # after the same approval and smoke tests as app.gocov.dev (and
  # docs.gocov.dev). A merged bump never sends a new CLI to a server that
  # is still on the old release.
  bump-wrappers:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.CROSSBUMP_APP_ID }}
          private-key: ${{ secrets.CROSSBUMP_APP_PRIVATE_KEY }}
          owner: gocov
          repositories: gocov-action,upload-pipe,gitlab-component
          # Only what the steps below do: push the bump branch (contents),
          # open, label and auto-merge the PR (pull-requests).
          permission-contents: write
          permission-pull-requests: write

      # scripts/bump-wrapper.sh makes the edits — pin, next version,
      # CHANGELOG.md entry — and is tested against the real wrappers on
      # every CI run (scripts/bump-wrapper-test.sh); these steps only
      # clone, commit and open the PR. From the workflow's own ref, like
      # deploy.yml's task definition template.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Open the gocov-action bump PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/gocov/gocov-action" action
          out=$(scripts/bump-wrapper.sh action action "$TAG")
          if [ -z "$out" ]; then echo "gocov-action already pins $TAG"; exit 0; fi
          read -r old next <<<"$out"
          cd action
          git config user.name "gocov-cross-repo-bump[bot]"
          git config user.email "gocov-cross-repo-bump[bot]@users.noreply.github.com"
          git checkout -q -b "bump-gocov-$TAG"
          git commit -qam "Pin gocov CLI $TAG as v$next"
          git push -qf origin "bump-gocov-$TAG"
          gh pr create --repo gocov/gocov-action --base main \
            --head "bump-gocov-$TAG" --label release \
            --title "Pin gocov CLI $TAG as v$next" \
            --body "gocov $TAG is released; this pins the CLI the action installs (was $old) and cuts v$next. Merging this releases the action: v$next is tagged from CHANGELOG.md and v1 moves to it." \
            || echo "::notice::bump PR for $TAG already open"

      - name: Open the upload-pipe bump PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/gocov/upload-pipe" pipe
          out=$(scripts/bump-wrapper.sh pipe pipe "$TAG")
          if [ -z "$out" ]; then echo "upload-pipe already pins $TAG"; exit 0; fi
          read -r old next <<<"$out"
          cd pipe
          git config user.name "gocov-cross-repo-bump[bot]"
          git config user.email "gocov-cross-repo-bump[bot]@users.noreply.github.com"
          git checkout -q -b "bump-gocov-$TAG"
          git commit -qam "Bake gocov CLI $TAG as $next"
          git push -qf origin "bump-gocov-$TAG"
          gh pr create --repo gocov/upload-pipe --base main \
            --head "bump-gocov-$TAG" --label release \
            --title "Bake gocov CLI $TAG as $next" \
            --body "gocov $TAG is released; this bakes it into the pipe image as $next (was $old). Merging this releases the pipe: $next is tagged from CHANGELOG.md, the multi-arch image goes to Docker Hub, and the GitHub release follows." \
            || echo "::notice::bump PR for $TAG already open"

      - name: Open the gitlab-component bump PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/gocov/gitlab-component" component
          out=$(scripts/bump-wrapper.sh component component "$TAG")
          if [ -z "$out" ]; then echo "gitlab-component already pins $TAG"; exit 0; fi
          read -r old next <<<"$out"
          cd component
          git config user.name "gocov-cross-repo-bump[bot]"
          git config user.email "gocov-cross-repo-bump[bot]@users.noreply.github.com"
          git checkout -q -b "bump-gocov-$TAG"
          git commit -qam "Install gocov CLI $TAG as $next"
          git push -qf origin "bump-gocov-$TAG"
          gh pr create --repo gocov/gitlab-component --base main \
            --head "bump-gocov-$TAG" --label release \
            --title "Install gocov CLI $TAG as $next" \
            --body "gocov $TAG is released; this pins the CLI the component installs (was $old) and cuts $next. Merging this releases the component: $next is tagged from CHANGELOG.md, mirrored to gitlab.com/gocov/gocov, and its pipeline publishes the CI/CD Catalog release." \
            || echo "::notice::bump PR for $TAG already open"

      - name: Queue the bump PRs for auto-merge
        # Each wrapper's PR checks install the new CLI and upload with it
        # (the action on every runner OS, the pipe and the component
        # against a fake server on amd64 and arm64), and the server side
        # was smoke-tested by the deploy this job waits for — so once
        # those checks pass there is nothing left to decide, and the merge
        # that releases the wrapper is GitHub's auto-merge.
        #
        # Only where the wrapper's main requires status checks: without
        # them GitHub would merge on the spot, before any test ran, so such
        # a PR is left for a human with a warning. Squash, as in all three
        # repos: a bump PR is one commit, and main keeps one line per release.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          failed=0
          for repo in gocov-action upload-pipe gitlab-component; do
            state=$(gh pr view "bump-gocov-$TAG" --repo "gocov/$repo" \
              --json state --jq .state 2>/dev/null || echo none)
            if [ "$state" != OPEN ]; then
              echo "$repo: no open bump PR for $TAG ($state)"; continue
            fi
            # Required checks come from a ruleset or from classic branch
            # protection; the App's read access sees either.
            required=$( {
              gh api "repos/gocov/$repo/rules/branches/main" \
                --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' || true
              gh api "repos/gocov/$repo/branches/main" \
                --jq '.protection.required_status_checks.contexts[]?' || true
            } | sort -u)
            if [ -z "$required" ]; then
              echo "::warning::gocov/$repo requires no status checks on main — its bump PR for $TAG is left for a human to merge"
              continue
            fi
            echo "$repo: auto-merging once these pass:"
            printf '%s\n' "$required" | sed 's/^/  /'
            gh pr merge "bump-gocov-$TAG" --repo "gocov/$repo" --auto --squash || {
              echo "::error::could not queue gocov/$repo's bump PR for auto-merge — is auto-merge allowed in its settings?"
              failed=1
            }
          done
          exit "$failed"

  # Deploying is a separate, reusable workflow so a rollback is the same
  # job dispatched by hand with an older tag. Its job carries
  # environment: production, so the run waits here for approval.
  # contents: write is for its docs job, which moves docs-live to the tag.
  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit # zizmor: ignore[secrets-inherit] — this repo's own workflow; GOCOV_TOKEN for its smoke upload
    permissions:
      id-token: write
      contents: write
