name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # id-token lets the coverage upload authenticate via OIDC instead of a
    # pasted GOCOV_TOKEN — dogfooding the tokenless path on our own repo.
    # A job-level block replaces the workflow default, so restate contents.
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gocov
          POSTGRES_PASSWORD: gocov
          POSTGRES_DB: gocov
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gocov -d gocov"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check version pins agree
        run: ./scripts/check-pins.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || {
            echo "::error::not gofmt-formatted — run gofmt -w on:"; echo "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      # -race: the server runs concurrent work (per-commit merges, status
      # pushes, grant refreshes) behind locks, and a data race there is
      # the kind of bug no test assertion sees. Atomic coverage is what
      # -race needs anyway.
      - name: Test (with Postgres integration tests, race detector on)
        env:
          GOCOV_TEST_DATABASE_URL: postgres://gocov:gocov@localhost:5432/gocov
        run: go test -race ./... -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage to gocov
        uses: gocov/gocov-action@v1
        with:
          files: coverage.out
          # One part of the commit's report; the web job uploads the other.
          part: go
          # No token: a push or same-repo PR uploads via OIDC (id-token
          # above); a fork PR, which gets no id-token, falls back to the
          # App-verified tokenless path automatically.

  # Known vulnerabilities the code actually reaches — in the standard
  # library (fixed by bumping the go directive in go.mod) or in a
  # dependency (fixed by bumping it). Dependabot bumps versions;
  # govulncheck is what says a reachable call is affected. It reads
  # vuln.go.dev, so a newly published advisory can turn this red on a PR
  # that did not cause it: the fix is still the bump it names.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The single-page web UI: typecheck, unit tests and a production build.
  # The Go job above does not depend on it — without a build the server
  # embeds a placeholder and its tests still pass.
  web:
    runs-on: ubuntu-latest
    # For the tokenless OIDC coverage upload, as in the test job.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test (with coverage)
        run: npm run coverage
      # Merged with the Go job's part into one report per commit. The LCOV
      # paths are already repo-relative (web/src/...), see vite.config.ts.
      - name: Upload coverage to gocov
        uses: gocov/gocov-action@v1
        with:
          files: web/coverage/lcov.info
          part: web
      - name: Typecheck and build
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Zensical
        run: pip install -r requirements-docs.txt
      - name: Build docs site (strict — a broken link fails here, not in production)
        run: zensical build --strict
