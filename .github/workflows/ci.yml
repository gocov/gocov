name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gocov
          POSTGRES_PASSWORD: gocov
          POSTGRES_DB: gocov
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gocov -d gocov"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (with Postgres integration tests)
        env:
          GOCOV_TEST_DATABASE_URL: postgres://gocov:gocov@localhost:5432/gocov
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage to gocov
        uses: gocov/gocov-action@v1
        with:
          files: coverage.out
          token: ${{ secrets.GOCOV_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Zensical
        run: pip install -r requirements-docs.txt
      - name: Build docs site (strict — a broken link fails here, not in production)
        run: zensical build --strict
