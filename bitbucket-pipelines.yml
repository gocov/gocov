# gocov dogfoods itself: every build uploads its own coverage with the
# gocov pipe (bitbucket.org/gocov/upload-pipe) to a gocov instance. Set
# GOCOV_SERVER and GOCOV_TOKEN as repository variables.
image: golang:1.26

pipelines:
  default:
    - step:
        name: Test and upload coverage
        script:
          - go vet ./...
          - go test ./... -covermode=atomic -coverprofile=coverage.out
          - pipe: docker://gocov/upload-pipe:0
            variables:
              FILES: coverage.out
              TOKEN: $GOCOV_TOKEN
              SERVER: $GOCOV_SERVER
