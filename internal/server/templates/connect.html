{{define "title"}}gocov — connect{{end}}
{{define "content"}}
<h1>{{.Heading}}</h1>
<div class="card pad">
  <p class="sub">{{.Message}}</p>
  {{range $i, $a := .Actions}}{{if $a.URL}}<p><a class="btn{{if eq $i 0}} primary{{end}}" href="{{$a.URL}}"{{if $a.External}} target="_blank" rel="noopener"{{end}}>{{$a.Label}}</a></p>{{end}}{{end}}
  <p><a href="/">Back to the dashboard</a></p>
</div>
{{end}}
