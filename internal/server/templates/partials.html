{{define "covbar"}}<span class="cov"><span class="track"><span class="fill {{covclass .}}" style="width: {{printf "%.1f" .}}%"></span></span><span class="pct {{covclass .}}">{{pct .}}</span></span>{{end}}

{{define "delta"}}{{if .}}<span class="delta {{.Class}}">{{.Arrow}} {{.Text}}</span>{{end}}{{end}}

{{define "gatechip"}}{{if eq . "pass"}}<span class="chip pass">&#10003; gate</span>{{else if eq . "fail"}}<span class="chip fail">&#10007; gate</span>{{end}}{{end}}

{{define "gate"}}
<div class="gate"{{if not .Value}} data-off{{end}}>
  <span><span class="n">{{.Label}}</span><br><span class="m">{{.Help}}</span></span>
  <span class="ctl">
    <input class="input gate-input" type="number" name="{{.Name}}" min="0" max="100" step="0.1"
           value="{{with .Value}}{{.}}{{end}}"{{if not .Value}} disabled{{end}}>
    <span class="muted">%</span>
    <button class="tg" type="button" aria-pressed="{{if .Value}}true{{else}}false{{end}}"
            aria-label="Toggle {{.Label}}"></button>
  </span>
</div>
{{end}}
